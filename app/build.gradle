def generatedLocaleListDir = layout.buildDirectory.dir('generated/source/locale/fulguris/locale')

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()
    namespace = 'fulguris'

    // ==========================================================
    // 修改输出的 APK / AAB 基础前缀为 Jincheng
    // ==========================================================
    project.ext.archivesBaseName = "Jincheng"

    defaultConfig {
        // 修改为独立的金成浏览器 Application ID，防止与原版应用冲突
        applicationId "com.jincheng.browser"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.compileSdk.get().toInteger()
        vectorDrawables.useSupportLibrary = true
    }

    sourceSets {
        main {
            java {
                srcDirs += generatedLocaleListDir
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
            multiDexEnabled = true
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-project.txt'
            applicationIdSuffix = ".debug"
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }

        release {
            debuggable = false
            multiDexEnabled = true
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-project.txt'
            ndk {
            }
            enableUnitTestCoverage = false
            enableAndroidTestCoverage = false
        }
    }

    testOptions {
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
    }

    flavorDimensions "BRAND", "VERSION", "PUBLISHER"

    productFlavors {
        slions {
            dimension "BRAND"
            isDefault = true
            applicationId "com.jincheng.browser"
            versionCode libs.versions.slions.version.code.get().toInteger()
            versionName libs.versions.slions.version.name.get()
        }

        base {
            dimension "VERSION"
            buildConfigField "boolean", "FULL_VERSION", "Boolean.parseBoolean(\"true\")"
        }

        full {
            dimension "VERSION"
            isDefault = true
            buildConfigField "boolean", "FULL_VERSION", "Boolean.parseBoolean(\"true\")"
            applicationIdSuffix ".full"
        }

        undef {
            dimension "PUBLISHER"
            buildConfigField "fulguris.Sponsorship", "SPONSORSHIP", "fulguris.Sponsorship.BRONZE"
        }

        playstore {
            dimension "PUBLISHER"
            applicationIdSuffix ".playstore"
            buildConfigField "fulguris.Sponsorship", "SPONSORSHIP", "fulguris.Sponsorship.TIN"
        }

        download {
            dimension "PUBLISHER"
            isDefault = true
            applicationIdSuffix ".download"
            buildConfigField "fulguris.Sponsorship", "SPONSORSHIP", "fulguris.Sponsorship.BRONZE"
        }

        fdroid {
            dimension "PUBLISHER"
            applicationIdSuffix ".fdroid"
            buildConfigField "fulguris.Sponsorship", "SPONSORSHIP", "fulguris.Sponsorship.BRONZE"
        }

        agent {
            dimension "PUBLISHER"
            applicationIdSuffix ".agent"
            buildConfigField "fulguris.Sponsorship", "SPONSORSHIP", "fulguris.Sponsorship.BRONZE"
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (names.contains("slions") && (names.contains("undef") || names.contains("base"))) {
            setIgnore(true)
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += ['.readme']
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def versionName = variant.versionName
            // ==========================================================
            // 将打出来的 APK 名字前缀从 Fulguris 改成 Jincheng
            // ==========================================================
            if (variant.flavorName.contains("slions")) {
                outputFileName = outputFileName.replaceFirst("^${base.archivesName.get()}", "Jincheng-v$versionName")
            }
        }
        variant.resValue "string", "application_id", "\"${applicationId}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }
    lint {
        abortOnError = true
    }
}

jacoco {
    toolVersion = '0.8.7'
}

android.applicationVariants.configureEach { variant ->
    if (!variant.flavorName.contains("slions")) return
    def variantName = variant.name.capitalize()
    tasks.matching { it.name == "sign${variantName}Bundle" }.configureEach { signTask ->
        def aabFileName = signTask.finalBundleFileName.replaceFirst(/^app-/, "Jincheng-v${variant.versionName}-")
        signTask.finalBundleFile.set(layout.buildDirectory.file("outputs/bundle/${variant.name}/${aabFileName}"))
    }
    tasks.matching { it.name == "bundle${variantName}" }.configureEach { bundleTask ->
        bundleTask.doLast {
            def outDir = layout.buildDirectory.dir("outputs/bundle/${variant.name}").get().asFile
            outDir.listFiles()?.findAll { it.name.startsWith("app-") && it.name.endsWith(".aab") }?.each { aab ->
                if (!aab.renameTo(new File(outDir, aab.name.replaceFirst(/^app-/, "Jincheng-v${variant.versionName}-")))) {
                    throw new GradleException("Failed to rename AAB ${aab.name}")
                }
                println "Renamed AAB: ${aab.name}"
            }
        }
    }
}

