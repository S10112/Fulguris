name: Build Fulguris APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码及所有子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        # 使用 assembleDebug 会让 Gradle 自动对齐多模块间的依赖匹配
        run: ./gradlew assembleDebug --stacktrace

      - name: 提取并上传生成的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
