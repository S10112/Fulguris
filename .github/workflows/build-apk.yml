name: Build Fulguris Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码及所有子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 生成签名密钥 (解决 validateSigning 校验失败)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 编译 Release 正式版 APK
        run: ./gradlew assembleSlionsFullDownloadRelease --stacktrace

      - name: 提取并上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Release-APK
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
