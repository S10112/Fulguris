name: Build Fulguris Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码及所有子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Release APK
        run: ./gradlew assembleSlionsFullDownloadRelease --stacktrace

      - name: 使用系统原生 apksigner 执行完整签名 (彻底修复 -103 解析失败)
        run: |
          # 1. 创建签名证书
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 2. 定位生成的未签名 APK
          UNSIGNED_APK=$(find app/build/outputs/apk/slionsFullDownload/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"

          # 3. 寻找 GitHub Actions 自带的最新 build-tools 路径
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

          # 4. 执行 4 字节对齐
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          # 5. 执行 v1 + v2 + v3 完整证书签名
          $BUILD_TOOLS_DIR/apksigner sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Fulguris-Release-Signed.apk \
            app-aligned.apk

          # 6. 验证签名完整性
          $BUILD_TOOLS_DIR/apksigner verify --verbose Fulguris-Release-Signed.apk

      - name: 提取并上传已签名的正式版 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Release-APK
          path: Fulguris-Release-Signed.apk
          if-no-files-found: error
