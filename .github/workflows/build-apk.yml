name: Build Fulguris APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: # 允许在网页上随时手动点击按钮一键打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        # 编译标准的 Full 版本 Debug APK，不带混淆，最快且 100% 稳定
        run: ./gradlew assembleSlionsFullDownloadDebug --stacktrace

      - name: 提取并上传生成的 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
