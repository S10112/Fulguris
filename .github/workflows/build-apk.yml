name: Build Fulguris Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码及所有子模块
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 配置 Release 签名并构建
        # 仅针对目标变体构建，使用 debug 签名保证直接安装，并自动关闭 LeakCanary
        run: |
          ./gradlew assembleSlionsFullDownloadRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --stacktrace

      - name: 提取并上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fulguris-Release-APK
          path: app/build/outputs/apk/slionsFullDownload/release/*.apk
          if-no-files-found: error
